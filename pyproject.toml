[project]
name = "pgsrip"
version = "0.3.0-dev"
description = "Rip your PGS subtitles"
authors = [
    { name = "Rato" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "video",
    "mkv",
    "subtitles",
    "rip",
    "srt",
    "pgs",
    "sup",
    "sub",
    "metadata",
    "movie",
    "episode",
    "tv",
    "shows",
    "series",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "babelfish>=0.6.1",
    "cleanit>=0.5.1",
    "click>=8.5.0",
    "pysrt>=1.1.2",
    "pytesseract>=0.3.10",
    "numpy>=2.2",
    "opencv-python>=4.12.0",
    "trakit>=0.2.3",
    "setuptools>=70.1.0",
    "pyyaml>=6.0",
    "appdirs>=1.4.4",
]

[project.optional-dependencies]
# an extra, not a dependency: onnxruntime has no musl Linux wheel and no sdist, and no marker can detect musl.
# The markers: the platforms with onnxruntime wheels. pgsrip.engines.rapidocr uses the raw model output: keep the minor version.
rapidocr = [
    "rapidocr>=3.9,<3.10; (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64')) or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
    "onnxruntime>=1.30; (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64')) or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
    # RapidOCR puts the Arabic text in reading order with it
    "python-bidi>=0.6; (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64')) or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
]

[project.urls]
Repository = "https://github.com/ratoaq2/pgsrip"

[project.scripts]
pgsrip = "pgsrip.cli:pgsrip"

[dependency-groups]
dev = [
    # the tests and CI use RapidOCR
    "pgsrip[rapidocr]",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "mypy>=1.17.0",
    "ruff",
    "pre-commit",
    "types-pyyaml>=6.0.12.20260906",
    "types-appdirs>=1.4.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pgsrip"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"pgsrip/__init__.py" = ["F401", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["pgsrip"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "babelfish.*",
    "cleanit.*",
    "cv2.*",
    "onnxruntime.*",
    "pysrt.*",
    "pytesseract.*",
    "rapidocr.*",
    "trakit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pgsrip"]
